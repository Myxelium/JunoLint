name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm test

      - name: Publish to npm when the version is new
        id: publish
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is already on npm"
            exit 0
          fi

          echo "already_published=false" >> "$GITHUB_OUTPUT"
          # Do not set registry-url / NODE_AUTH_TOKEN. That writes an empty
          # _authToken into .npmrc and blocks npm's GitHub OIDC exchange.
          npm publish --access public

      - name: Create GitHub Release
        if: steps.publish.outputs.already_published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.publish.outputs.version }}" \
            --target "${GITHUB_SHA}" \
            --title "v${{ steps.publish.outputs.version }}" \
            --generate-notes
